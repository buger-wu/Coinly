# ============================================================
# Coinly 后端服务 - 开发环境配置
# ============================================================
# 激活方式：启动时通过 -Dspring.profiles.active=dev 激活
# ============================================================

spring:
  application:
    name: coinly-backend
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/coinly?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5          # 最小空闲连接数
      maximum-pool-size: 10    # 最大连接数
      idle-timeout: 30000      # 空闲连接超时（毫秒）
      max-lifetime: 1800000    # 连接最大生命周期（毫秒）
      connection-timeout: 30000 # 获取连接超时（毫秒）
      pool-name: CoinlyHikariPoolDev

server:
  port: 8080
  servlet:
    context-path: /api

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
