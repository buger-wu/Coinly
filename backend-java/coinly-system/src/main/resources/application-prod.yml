spring:
  application:
    name: coinly-backend
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/coinly?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
      pool-name: CoinlyHikariPoolProd

server:
  port: 8080
  servlet:
    context-path: /api

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

# JWT 配置（生产环境建议通过环境变量覆盖：JWT_SECRET_KEY）
jwt:
  secret-key: ${JWT_SECRET_KEY:coinly-secret-key-for-jwt-token-generation-2024}
  expiration: 604800000  # 7天（毫秒）

# CORS 配置（生产环境建议通过环境变量覆盖：CORS_ALLOWED_ORIGINS）
cors:
  allowed-origins:
    - ${CORS_ALLOWED_ORIGIN:http://localhost:5173}

# Knife4j 配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
  packages-to-scan: com.coinly.business
knife4j:
  enable: false
  setting:
    language: zh_cn
